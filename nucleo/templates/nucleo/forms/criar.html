
{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Colaborador</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <div class="container">
        <h1>Adicionar Colaborador</h1>

        <form action="{% url 'nucleo-salvar' %}" method="POST">
            {% csrf_token %}

            <div>
                <label for="nome">Nome</label>
                <input
                    type="text"
                    id="nome"
                    name="nome"
                    maxlength="30"
                    required
                >
            </div>

            <div>
                <label for="telefone">Telefone</label>
                <input
                    type="text"
                    id="telefone"
                    name="telefone"
                    maxlength="30"
                >
            </div>

            <div>
                <button type="submit">Salvar</button>
                <a href="{% url 'nucleo-inicial' %}">Cancelar</a>
            </div>
        </form>
    </div>
</body>
</html>
